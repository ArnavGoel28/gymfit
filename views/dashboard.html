<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Dashboard - GymFit</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <img src="/images/lnmiit.webp" alt="LNMIIT Logo" style="height:40px; margin-right:1rem;">
            <h1>GymFit</h1>
        </div>
        <ul id="nav-right">
            <!-- Populated by setupNav() -->
        </ul>
    </nav>
    <div class="container" style="align-items: flex-start;">
        <div class="dashboard-wrapper">
            <div class="card">
                <h3>Daily Attendance</h3>
                <p style="color:var(--text-muted); margin-bottom:1rem;">Track your gym visits. Scan your QR code or manually check-in below.</p>
                <button class="btn-action" id="markAttendanceBtn">Mark Present Today</button>
            </div>
            
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>My Booked Slots</h3>
                    <a href="/views/book-slot.html" class="btn-action" style="text-decoration:none; text-align:center; display:block; max-width: 200px;">Book New Slot</a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time Slot</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="/js/main.js"></script>
    <script>
        checkAuth();
        setupNav();
        const user = getAuthUser();
        
        document.getElementById('markAttendanceBtn').addEventListener('click', async () => {
            const date = new Date().toISOString().split('T')[0];
            try {
                const res = await fetch('/api/attendance/mark', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ userId: user.id, date })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Attendance marked successfully!');
                } else {
                    showToast(data.msg, true);
                }
            } catch (error) {
                showToast('Error marking attendance', true);
            }
        });

        async function loadBookings() {
            try {
                const res = await fetch(`/api/booking/mybookings/${user.id}`, {
                    headers: getAuthHeaders()
                });
                const bookings = await res.json();
                const tbody = document.getElementById('bookingsTableBody');
                tbody.innerHTML = '';
                
                if (bookings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted)">No bookings found.</td></tr>';
                    return;
                }
                
                bookings.forEach(b => {
                    const statusClass = b.status === 'booked' ? 'status-booked' : 'status-cancelled';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${b.date}</td>
                        <td>${b.slotTime}</td>
                        <td><span class="status-badge ${statusClass}">${b.status.toUpperCase()}</span></td>
                        <td>
                            ${b.status === 'booked' ? `<button onclick="cancelBooking('${b._id}')" class="btn-action" style="margin-top:0; padding:5px 10px; width:auto;">Cancel</button>` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                showToast('Failed to load bookings', true);
            }
        }
        
        async function cancelBooking(id) {
            if(!confirm('Are you sure you want to cancel this booking?')) return;
            try {
                const res = await fetch(`/api/booking/cancel/${id}`, { 
                    method: 'PUT',
                    headers: getAuthHeaders()
                });
                if(res.ok) {
                    showToast('Booking cancelled');
                    loadBookings();
                } else {
                    showToast('Failed to cancel', true);
                }
            } catch(e) {
                showToast('Error cancelling booking', true);
            }
        }
        
        loadBookings();
    </script>
</body>
</html>
