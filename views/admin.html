<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GymFit</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <img src="/images/lnmiit.webp" alt="LNMIIT Logo" style="height:40px; margin-right:1rem;">
            <h1>GymFit Admin</h1>
        </div>
        <ul id="nav-right">
            <!-- Populated by setupNav() -->
        </ul>
    </nav>
    <div class="container" style="align-items: flex-start;">
        <div class="dashboard-wrapper">
            
            <div class="stats-grid" id="analyticsGrid">
                <div class="stat-card">
                    <h4>Today's Attendance</h4>
                    <div class="value" id="statAttendance">0</div>
                </div>
                <div class="stat-card">
                    <h4>Total Members</h4>
                    <div class="value" id="statMembers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Busiest Slot</h4>
                    <div class="value" style="font-size:1.5rem" id="statSlot">-</div>
                </div>
            </div>

            <div class="card" style="margin-bottom: 2rem;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>All Bookings (Today)</h3>
                    <input type="date" id="filterDate" style="padding:0.5rem; background:var(--card-bg); border:1px solid var(--border-color); color:var(--text-main); border-radius:4px;">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Member</th>
                            <th>Email</th>
                            <th>Time Slot</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminBookingsTable">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
            
            <div class="card">
                <h3>Today's Attendance List</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Member Name</th>
                            <th>Email</th>
                            <th>Time Recorded</th>
                        </tr>
                    </thead>
                    <tbody id="adminAttendanceTable">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    
    <script src="/js/main.js"></script>
    <script>
        // Restrict access to admin
        checkAuth();
        setupNav();
        const user = getAuthUser();
        if(user.role !== 'admin') {
            window.location.href = '/views/dashboard.html';
        }
        
        const dateInput = document.getElementById('filterDate');
        dateInput.value = new Date().toISOString().split('T')[0];
        dateInput.addEventListener('change', () => {
            loadBookings(dateInput.value);
            loadAttendance(dateInput.value);
        });

        async function loadAnalytics() {
            try {
                const res = await fetch('/api/admin/analytics', {
                    headers: getAuthHeaders()
                });
                const data = await res.json();
                document.getElementById('statAttendance').textContent = data.todayAttendance;
                document.getElementById('statMembers').textContent = data.members;
                document.getElementById('statSlot').textContent = data.mostBusySlot;
            } catch(e) {
                console.error('Error loading analytics');
            }
        }
        
        async function loadBookings(dateStr) {
            try {
                const res = await fetch(`/api/admin/bookings?date=${dateStr}`, {
                    headers: getAuthHeaders()
                });
                const b = await res.json();
                const tbody = document.getElementById('adminBookingsTable');
                tbody.innerHTML = '';
                if(b.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">No bookings.</td></tr>';
                    return;
                }
                b.forEach(item => {
                    const statusClass = item.status === 'booked' ? 'status-booked' : 'status-cancelled';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.userId ? item.userId.name : 'Unknown User'}</td>
                        <td>${item.userId ? item.userId.email : 'N/A'}</td>
                        <td>${item.slotTime}</td>
                        <td><span class="status-badge ${statusClass}">${item.status.toUpperCase()}</span></td>
                        <td>
                            ${item.status === 'booked' ? `<button onclick="adminCancel('${item._id}')" class="btn-action" style="margin-top:0; padding:5px 10px; width:auto;">Cancel</button>` : '-'}
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                console.error(e);
            }
        }
        
        async function loadAttendance(dateStr) {
            try {
                const res = await fetch(`/api/admin/attendance?date=${dateStr}`, {
                    headers: getAuthHeaders()
                });
                const att = await res.json();
                const tbody = document.getElementById('adminAttendanceTable');
                tbody.innerHTML = '';
                if(att.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">No attendance records.</td></tr>';
                    return;
                }
                att.forEach(item => {
                    const time = new Date(item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.userId ? item.userId.name : 'Unknown'}</td>
                        <td>${item.userId ? item.userId.email : 'N/A'}</td>
                        <td>${time}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch(e) {
                console.error(e);
            }
        }
        
        async function adminCancel(id) {
            if(!confirm('Cancel this booking as Admin?')) return;
            try {
                const res = await fetch(`/api/admin/booking/${id}`, { 
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });
                if(res.ok) {
                    showToast('Booking deleted');
                    loadBookings(document.getElementById('filterDate').value);
                    loadAnalytics();
                } else {
                    showToast('Failed to cancel', true);
                }
            } catch(e) {
                showToast('Error', true);
            }
        }

        // Init
        loadAnalytics();
        loadBookings(dateInput.value);
        loadAttendance(dateInput.value);
    </script>
</body>
</html>
