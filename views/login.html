<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym Management Setup</title>
    <meta name="description" content="Secure login for gym users and administrators.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div style="display:flex; align-items:center;">
            <img src="/images/lnmiit.webp" alt="LNMIIT Logo" style="height:40px; margin-right:1rem;">
            <h1>GymFit</h1>
        </div>
        <ul>
            <li><a href="/views/register.html">Register</a></li>
            <li><a href="/views/login.html" class="auth-btn">Login</a></li>
        </ul>
    </nav>
    <div class="container">
        <div class="auth-box">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-submit">Sign In</button>
                <a href="/views/register.html" class="switch-link">Don't have an account? <span>Sign Up</span></a>
            </form>
        </div>
    </div>
    <script src="/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showToast('Login successful!');
                    setTimeout(() => {
                        window.location.href = data.user.role === 'admin' ? '/views/admin.html' : '/views/dashboard.html';
                    }, 1000);
                } else {
                    showToast(data.msg || 'Login failed', true);
                }
            } catch (err) {
                showToast('Server error', true);
            }
        });
    </script>
</body>
</html>
